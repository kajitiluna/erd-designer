name: Deploy service

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
      - '.vscode/**'
      - '*.md'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  generate_version:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.ver.outputs.app_version }}
    steps:
      - name: Generate App Version
        id: ver
        run: |
          APP_VERSION="0.$(TZ=Asia/Tokyo date '+%y%m%d').$(TZ=Asia/Tokyo date '+%H%M%S')"
          echo "app_version=${APP_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Start to build APP_VERSION : ${APP_VERSION}"

  build:
    runs-on: ubuntu-latest
    needs: generate_version
    permissions:
      contents: write
    environment:
      name: github-pages
    env:
      APP_VERSION: ${{ needs.generate_version.outputs.app_version }}
      VITE_APP_VERSION: ${{ needs.generate_version.outputs.app_version }}
      VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      VITE_GOOGLE_SITE_VERTIFICATION: ${{ secrets.GOOGLE_SITE_VERTIFICATION }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Apply app version
        run: npm version "${APP_VERSION}" --no-git-tag-version

      - name: Build Application
        run: npm run build && npm run package

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Upload VSCode Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: ./*.vsix

      - name: Push git tag
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "actions@github.com"
          
          # 年月を取得（Asia/Tokyo タイムゾーン）
          YEAR=$(TZ=Asia/Tokyo date '+%Y')
          MONTH=$(TZ=Asia/Tokyo date '+%m')
          
          TAG_VERSION="github-page/${YEAR}/${MONTH}/v${APP_VERSION}"
          git tag -a "${TAG_VERSION}" -m "Version ${TAG_VERSION} - Auto-generated by GitHub Actions"
          git push origin "${TAG_VERSION}"

  deploy-page:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-vscode-extension:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: vscode-extension
    steps:
      - name: Download VSCode Extension Artifact
        uses: actions/download-artifact@v4
        with:
          name: vscode-extension
          path: ./

      - name: Publish VSCode Extension
        run: npx vsce publish --packagePath *.vsix --pat ${VSCE_PAT}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}