name: Deploy service

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/**'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
      - '.vscode/**'
      - 'samples/**'
      - '*.md'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  generate_version:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.ver.outputs.app_version }}
    steps:
      - name: Generate App Version
        id: ver
        run: |
          APP_VERSION="0.$(TZ=Asia/Tokyo date '+%y%m%d').$(TZ=Asia/Tokyo date '+%H%M%S')"
          echo "app_version=${APP_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Start to build APP_VERSION : ${APP_VERSION}"

  build:
    runs-on: ubuntu-latest
    needs: generate_version
    permissions:
      contents: write
    environment:
      name: github-pages
    env:
      APP_VERSION: ${{ needs.generate_version.outputs.app_version }}
      VITE_APP_VERSION: ${{ needs.generate_version.outputs.app_version }}
      VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      VITE_GOOGLE_SITE_VERTIFICATION: ${{ secrets.GOOGLE_SITE_VERTIFICATION }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Apply app version
        run: npm version "${APP_VERSION}" --no-git-tag-version

      - name: Build Application
        run: npm run build && npm run package

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

      - name: Upload VSCode Extension Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-extension
          path: "*.vsix"

      - name: Push git tag
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "actions@github.com"
          
          # 年月を取得（Asia/Tokyo タイムゾーン）
          YEAR=$(TZ=Asia/Tokyo date '+%Y')
          MONTH=$(TZ=Asia/Tokyo date '+%m')
          
          TAG_VERSION="github-page/${YEAR}/${MONTH}/v${APP_VERSION}"
          git tag -a "${TAG_VERSION}" -m "Version ${TAG_VERSION} - Auto-generated by GitHub Actions"
          git push origin "${TAG_VERSION}"

  deploy-page:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  deploy-vscode-extension:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: vscode-extension
    steps:
      - name: Download VSCode Extension Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vscode-extension
          path: ./

      - name: Publish VSCode Extension
        run: npx @vscode/vsce publish --packagePath erd-designer-*.vsix --pat ${VSCE_PAT}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  create-release:
    runs-on: ubuntu-latest
    needs: [build, generate_version]
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.generate_version.outputs.app_version }}
        run: |
          DATE_PART=$(echo "${APP_VERSION}" | cut -d'.' -f2)
          YEAR="20${DATE_PART:0:2}"
          MONTH="${DATE_PART:2:2}"
          DAY="${DATE_PART:4:2}"
          APP_DATE="${YEAR}-${MONTH}-${DAY}"

          TAG_VERSION="github-page/${YEAR}/${MONTH}/v${APP_VERSION}"
          RELEASE_TITLE="v${APP_VERSION}"

          CHANGELOG_VERSION="0.${YEAR}${MONTH}${DAY}"
          CHANGELOG_HEADER="## [${CHANGELOG_VERSION}] - ${APP_DATE}"

          CHANGELOG_BODY=$(awk -v header="${CHANGELOG_HEADER}" '
            $0 == header {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md)

          if [ -n "$(echo "$CHANGELOG_BODY" | tr -d '[:space:]')" ]; then
            printf '%s\n' "$CHANGELOG_BODY" > /tmp/release_notes.md
            gh release create "${TAG_VERSION}" \
              --title "${RELEASE_TITLE}" \
              --notes-file /tmp/release_notes.md \
              --generate-notes
          else
            gh release create "${TAG_VERSION}" \
              --title "${RELEASE_TITLE}" \
              --generate-notes
          fi