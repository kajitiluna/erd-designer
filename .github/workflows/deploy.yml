name: Deploy service

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/**'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
      - '.vscode/**'
      - 'samples/**'
      - '*.md'
      - 'LICENSE'
      - 'docs/**'
      # agent-plugin/ はワークフロー自身がコミットする生成物を含むため、再トリガーさせない
      - 'agent-plugin/**'
      - '.claude-plugin/**'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions: {}

jobs:
  generate_version:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.ver.outputs.app_version }}
    steps:
      - name: Generate App Version
        id: ver
        run: |
          APP_VERSION="0.$(TZ=Asia/Tokyo date '+%y%m%d').$(TZ=Asia/Tokyo date '+%H%M%S')"
          echo "app_version=${APP_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Start to build APP_VERSION : ${APP_VERSION}"

  build:
    runs-on: ubuntu-latest
    needs: generate_version
    permissions:
      contents: write
    environment:
      name: github-pages
    env:
      APP_VERSION: ${{ needs.generate_version.outputs.app_version }}
      VITE_APP_VERSION: ${{ needs.generate_version.outputs.app_version }}
      VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      VITE_GOOGLE_SITE_VERTIFICATION: ${{ secrets.GOOGLE_SITE_VERTIFICATION }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          app-id: ${{ secrets.WORKFLOW_DEPLOY_APP_ID }}
          private-key: ${{ secrets.WORKFLOW_DEPLOY_PRIVATE_KEY }}

      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26

      - name: Install Dependencies
        run: npm ci

      - name: Apply app version
        run: npm version "${APP_VERSION}" --no-git-tag-version

      - name: Build Application
        run: npm run build && npm run package && npm run bundle:cli

      - name: Commit back agent CLI
        run: |
          # 配布パスは CI のみが更新する。ローカルビルドは out/cli/ に出力される
          CLI_DIST_PATH="agent-plugin/skills/erd-designer/scripts/erd-cli.cjs"
          if cmp -s out/cli/erd-cli.cjs "${CLI_DIST_PATH}"; then
            echo "No agent CLI changes. Skip committing back."
            exit 0
          fi

          git config --local user.name "GitHub Actions"
          git config --local user.email "actions@github.com"

          # プラグインのバージョンを更新する(コミットバックが発生するリリースのみ)
          node -e '
            const fs = require("fs");
            const pluginJsonPath = "agent-plugin/.claude-plugin/plugin.json";
            const pluginJson = JSON.parse(fs.readFileSync(pluginJsonPath, "utf-8"));
            pluginJson.version = process.env.APP_VERSION;
            fs.writeFileSync(pluginJsonPath, JSON.stringify(pluginJson, null, 4) + "\n");
          '

          cp out/cli/erd-cli.cjs "${CLI_DIST_PATH}"
          git add "${CLI_DIST_PATH}" agent-plugin/.claude-plugin/plugin.json
          git commit -m "Release agent plugin v${APP_VERSION} [skip ci]"
          # npm version により package.json が更新されているため autostash で退避する
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

      - name: Upload VSCode Extension Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-extension
          path: "*.vsix"

      - name: Upload agent CLI Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-cli
          path: out/cli/erd-cli.cjs

      - name: Push git tag
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "actions@github.com"
          
          # 年月を取得（Asia/Tokyo タイムゾーン）
          YEAR=$(TZ=Asia/Tokyo date '+%Y')
          MONTH=$(TZ=Asia/Tokyo date '+%m')
          
          TAG_VERSION="github-page/${YEAR}/${MONTH}/v${APP_VERSION}"
          git tag -a "${TAG_VERSION}" -m "Version ${TAG_VERSION} - Auto-generated by GitHub Actions"
          git push origin "${TAG_VERSION}"

  deploy-page:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  deploy-vscode-extension:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: vscode-extension
    steps:
      - name: Download VSCode Extension Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vscode-extension
          path: ./

      - name: Publish VSCode Extension
        run: npx @vscode/vsce publish --packagePath erd-designer-*.vsix --pat ${VSCE_PAT}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  deploy-open-vsx:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: open-vsx
    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26
          cache: npm

      # ovsx は devDependency のため、npx がローカル解決できるよう依存を導入する
      - name: Install Dependencies
        run: npm ci

      - name: Download VSCode Extension Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vscode-extension
          path: ./

      - name: Publish Open VSX Extension
        run: npx ovsx publish erd-designer-*.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

  create-release:
    runs-on: ubuntu-latest
    needs: [build, generate_version]
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download agent CLI Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-cli
          path: ./release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.generate_version.outputs.app_version }}
        run: |
          DATE_PART=$(echo "${APP_VERSION}" | cut -d'.' -f2)
          YEAR="20${DATE_PART:0:2}"
          MONTH="${DATE_PART:2:2}"
          DAY="${DATE_PART:4:2}"
          APP_DATE="${YEAR}-${MONTH}-${DAY}"

          TAG_VERSION="github-page/${YEAR}/${MONTH}/v${APP_VERSION}"
          RELEASE_TITLE="v${APP_VERSION}"

          CHANGELOG_VERSION="0.${YEAR}${MONTH}${DAY}"
          CHANGELOG_HEADER="## [${CHANGELOG_VERSION}] - ${APP_DATE}"

          CHANGELOG_BODY=$(awk -v header="${CHANGELOG_HEADER}" '
            $0 == header {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md)

          if [ -n "$(echo "$CHANGELOG_BODY" | tr -d '[:space:]')" ]; then
            printf '%s\n' "$CHANGELOG_BODY" > /tmp/release_notes.md
            gh release create "${TAG_VERSION}" \
              ./release-assets/erd-cli.cjs \
              --title "${RELEASE_TITLE}" \
              --notes-file /tmp/release_notes.md \
              --generate-notes
          else
            gh release create "${TAG_VERSION}" \
              ./release-assets/erd-cli.cjs \
              --title "${RELEASE_TITLE}" \
              --generate-notes
          fi