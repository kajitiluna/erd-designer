name: Create Historical Releases

on:
  workflow_dispatch:

jobs:
  create-releases:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create historical releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/create-historical-releases.py
